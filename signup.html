<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل - ميديكا</title>
    <link rel="stylesheet" href="auth-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="back-link">
                    <i class="fas fa-arrow-right"></i> رجوع
                </a>
                <h1>ميديكا</h1>
                <i class="fas fa-heartbeat"></i>
            </div>

            <form class="auth-form" id="signupForm">
                <h2>إنشاء حساب جديد 🚀</h2>
                <p>اختر نوع حسابك أولاً</p>

                <div class="role-selector">
                    <label class="role-option">
                        <input type="radio" name="role" value="patient" checked>
                        <span class="role-label">
                            <i class="fas fa-user"></i> مريض
                        </span>
                    </label>
                    <label class="role-option">
                        <input type="radio" name="role" value="doctor">
                        <span class="role-label">
                            <i class="fas fa-user-md"></i> دكتور
                        </span>
                    </label>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">الاسم الأول</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user"></i>
                            <input 
                                type="text" 
                                id="firstName" 
                                placeholder="أحمد" 
                                required
                            >
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="lastName">الاسم الأخير</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user"></i>
                            <input 
                                type="text" 
                                id="lastName" 
                                placeholder="محمد" 
                                required
                            >
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="signupEmail">البريد الإلكتروني</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input 
                            type="email" 
                            id="signupEmail" 
                            placeholder="your@email.com" 
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="phone">رقم الهاتف</label>
                    <div class="input-wrapper">
                        <i class="fas fa-phone"></i>
                        <input 
                            type="tel" 
                            id="phone" 
                            placeholder="+20 100 123 4567" 
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="signupPassword">كلمة المرور</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input 
                            type="password" 
                            id="signupPassword" 
                            placeholder="••••••••" 
                            required
                        >
                        <span class="toggle-password" onclick="toggleSignupPassword()">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                    <small class="password-hint">كلمة المرور يجب أن تكون 8 أحرف على الأقل</small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">تأكيد كلمة المرور</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            placeholder="••••••••" 
                            required
                        >
                    </div>
                </div>

                <label class="terms-checkbox">
                    <input type="checkbox" required>
                    <span>أوافق على 
                        <a href="#">شروط الخدمة</a> و
                        <a href="#">سياسة الخصوصية</a>
                    </span>
                </label>

                <button type="submit" class="btn-login-submit">إنشاء الحساب</button>

                <div class="divider">أو</div>

                <div class="social-login">
                    <button type="button" class="social-btn google">
                        <i class="fab fa-google"></i> جوجل
                    </button>
                    <button type="button" class="social-btn facebook">
                        <i class="fab fa-facebook"></i> فيس بوك
                    </button>
                </div>

                <div class="auth-footer">
                    <p>هل لديك حساب بالفعل؟ 
                        <a href="login.html">دخول</a>
                    </p>
                </div>
            </form>

            <div class="auth-features">
                <div class="feature">
                    <i class="fas fa-check-circle"></i>
                    <p>تسجيل آمن وموثوق</p>
                </div>
                <div class="feature">
                    <i class="fas fa-shield-alt"></i>
                    <p>حماية كاملة للبيانات</p>
                </div>
                <div class="feature">
                    <i class="fas fa-clock"></i>
                    <p>لا يستغرق أكثر من دقيقة</p>
                </div>
            </div>
        </div>

        <div class="auth-illustration">
            <div class="illustration-content">
                <i class="fas fa-heart"></i>
                <h3>صحتك أولويتنا 💚</h3>
                <p>انضم لآلاف المستخدمين السعداء</p>
            </div>
        </div>
    </div>

    <script src="auth-script.js"></script>
</body>
</html>
