<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Medica</title>
    <link rel="stylesheet" href="auth-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="back-link">
                    <i class="fas fa-arrow-right"></i> Back
                </a>
                <h1>Medica</h1>
                <i class="fas fa-heartbeat"></i>
            </div>

            <form class="auth-form" id="signupForm">
                <h2>Create a New Account 🚀</h2>
                <p>Choose your account type first</p>

                <div class="role-selector">
                    <label class="role-option">
                        <input type="radio" name="role" value="patient" checked>
                        <span class="role-label">
                            <i class="fas fa-user"></i> Patient
                        </span>
                    </label>
                    <label class="role-option">
                        <input type="radio" name="role" value="doctor">
                        <span class="role-label">
                            <i class="fas fa-user-md"></i> Doctor
                        </span>
                    </label>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user"></i>
                            <input 
                                type="text" 
                                id="firstName" 
                                placeholder="John" 
                                required
                            >
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user"></i>
                            <input 
                                type="text" 
                                id="lastName" 
                                placeholder="Doe" 
                                required
                            >
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="signupEmail">Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input 
                            type="email" 
                            id="signupEmail" 
                            placeholder="your@email.com" 
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <div class="input-wrapper">
                        <i class="fas fa-phone"></i>
                        <input 
                            type="tel" 
                            id="phone" 
                            placeholder="+20 100 123 4567" 
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input 
                            type="password" 
                            id="signupPassword" 
                            placeholder="••••••••" 
                            required
                        >
                        <span class="toggle-password" onclick="toggleSignupPassword()">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                    <small class="password-hint">Password must be at least 8 characters</small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            placeholder="••••••••" 
                            required
                        >
                    </div>
                </div>

                <label class="terms-checkbox">
                    <input type="checkbox" required>
                    <span>I agree to 
                        <a href="#">Terms of Service</a> and
                        <a href="#">Privacy Policy</a>
                    </span>
                </label>

                <button type="submit" class="btn-login-submit">Create Account</button>

                <div class="divider">or</div>

                <div class="social-login">
                    <button type="button" class="social-btn google">
                        <i class="fab fa-google"></i> Google
                    </button>
                    <button type="button" class="social-btn facebook">
                        <i class="fab fa-facebook"></i> Facebook
                    </button>
                </div>

                <div class="auth-footer">
                    <p>Already have an account? 
                        <a href="login.html">Login</a>
                    </p>
                </div>
            </form>

            <div class="auth-features">
                <div class="feature">
                    <i class="fas fa-check-circle"></i>
                    <p>Secure and trusted signup</p>
                </div>
                <div class="feature">
                    <i class="fas fa-shield-alt"></i>
                    <p>Complete data protection</p>
                </div>
                <div class="feature">
                    <i class="fas fa-clock"></i>
                    <p>Takes less than a minute</p>
                </div>
            </div>
        </div>

        <div class="auth-illustration">
            <div class="illustration-content">
                <i class="fas fa-heart"></i>
                <h3>Your health is our priority 💚</h3>
                <p>Join thousands of happy users</p>
            </div>
        </div>
    </div>

    <script src="auth-script.js"></script>
</body>
</html>
