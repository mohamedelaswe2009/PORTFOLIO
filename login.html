<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول - ميديكا</title>
    <link rel="stylesheet" href="auth-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="back-link">
                    <i class="fas fa-arrow-right"></i> رجوع
                </a>
                <h1>ميديكا</h1>
                <i class="fas fa-heartbeat"></i>
            </div>

            <form class="auth-form" id="loginForm">
                <h2>مرحباً بك مجدداً 👋</h2>
                <p>أدخل بيانات حسابك للدخول</p>

                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input 
                            type="email" 
                            id="email" 
                            placeholder="your@email.com" 
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input 
                            type="password" 
                            id="password" 
                            placeholder="••••••••" 
                            required
                        >
                        <span class="toggle-password" onclick="togglePassword()">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox">
                        <span>تذكرني</span>
                    </label>
                    <a href="#" class="forgot-password">نسيت كلمة المرور؟</a>
                </div>

                <button type="submit" class="btn-login-submit">دخول</button>

                <div class="divider">أو</div>

                <div class="social-login">
                    <button type="button" class="social-btn google">
                        <i class="fab fa-google"></i> جوجل
                    </button>
                    <button type="button" class="social-btn facebook">
                        <i class="fab fa-facebook"></i> فيس بوك
                    </button>
                </div>

                <div class="auth-footer">
                    <p>ليس لديك حساب؟ 
                        <a href="signup.html">إنشاء حساب جديد</a>
                    </p>
                </div>
            </form>

            <div class="auth-features">
                <div class="feature">
                    <i class="fas fa-lock"></i>
                    <p>بيانات محمية بالكامل</p>
                </div>
                <div class="feature">
                    <i class="fas fa-mobile-alt"></i>
                    <p>متوافق مع جميع الأجهزة</p>
                </div>
                <div class="feature">
                    <i class="fas fa-bolt"></i>
                    <p>دخول فوري وسريع</p>
                </div>
            </div>
        </div>

        <div class="auth-illustration">
            <div class="illustration-content">
                <i class="fas fa-user-md"></i>
                <h3>اهتم بصحتك 💚</h3>
                <p>استشارات طبية من أفضل الدكاترة</p>
            </div>
        </div>
    </div>

    <script src="auth-script.js"></script>
</body>
</html>
